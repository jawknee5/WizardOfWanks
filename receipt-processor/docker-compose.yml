version: '3.8'

services:
  # Receipt Processor App
  receipt-processor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: receipt-processor-app
    ports:
      - "3000:3000"
      - "5000:5000"
    environment:
      NODE_ENV: production
      REACT_APP_API_URL: http://localhost:3000
      REACT_APP_API_KEY: ${API_KEY}
      REACT_APP_SYNC_BATCH_SIZE: 100
      REACT_APP_AUTO_SYNC: "false"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - receipt-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: receipt-processor-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - receipt-processor
    networks:
      - receipt-network
    restart: unless-stopped

  # Optional: MongoDB for centralized sync tracking
  mongodb:
    image: mongo:6-alpine
    container_name: receipt-processor-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: receipt_processor
    volumes:
      - mongo_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - receipt-network
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  receipt-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
